cat > /tmp/application.yaml <<'EOF'
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sudoku
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/veerumatta/sudoko-game.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: sudoku

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
EOF
