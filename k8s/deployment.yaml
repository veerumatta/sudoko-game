apiVersion: apps/v1
kind: Deployment
metadata:
  name: sudoku
  namespace: sudoku
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sudoku
  template:
    metadata:
      labels:
        app: sudoku
    spec:
      containers:
        - name: sudoku
        image: docker.io/veeramattareddy/sudoko-game:856cb4749e34c9445431b6ce3f09f7f3b0f73a4f
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
