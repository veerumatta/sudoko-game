name: Sudoku DevSecOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  APP_NAME: sudoko-game

jobs:

  # ============================================================
  # 1. BUILD / VALIDATE
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          test -f Dockerfile

          echo "Application validation successful."

  # ============================================================
  # 2. SONARQUBE
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ============================================================
  # 3. SNYK
  # ============================================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Snyk
        run: |
          curl --compressed \
            https://static.snyk.io/cli/latest/snyk-linux \
            -o snyk

          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk

      - name: Snyk version
        run: snyk --version

      - name: Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --severity-threshold=high \
            || true

  # ============================================================
  # 4. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - snyk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:latest \
            .

      - name: Save Docker image
        run: |
          docker save \
            ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }} \
            -o sudoko-game.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: sudoko-docker-image
          path: sudoko-game.tar

  # ============================================================
  # 5. TRIVY
  # ============================================================
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build image for Trivy
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }} \
            .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # ============================================================
  # 6. PUSH TO BOTH DOCKER HUB + NEXUS
  # ============================================================
  push-images:
    name: Push Image to Docker Hub and Nexus
    runs-on: ubuntu-latest

    needs: trivy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Nexus Login
      # --------------------------------------------------------
      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # --------------------------------------------------------
      # Build image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:latest \
            -t ${{ secrets.NEXUS_URL }}/sudoko-game:${{ github.sha }} \
            -t ${{ secrets.NEXUS_URL }}/sudoko-game:latest \
            .

      # --------------------------------------------------------
      # Push Docker Hub
      # --------------------------------------------------------
      - name: Push to Docker Hub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:latest

      # --------------------------------------------------------
      # Push Nexus
      # --------------------------------------------------------
      - name: Push to Nexus
        run: |
          docker push \
            ${{ secrets.NEXUS_URL }}/sudoko-game:${{ github.sha }}

          docker push \
            ${{ secrets.NEXUS_URL }}/sudoko-game:latest

      - name: Images pushed successfully
        run: |
          echo "Docker Hub:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }}"

          echo "Nexus:"
          echo "${{ secrets.NEXUS_URL }}/sudoko-game:${{ github.sha }}"

  # ============================================================
  # 7. UPDATE KUBERNETES MANIFEST
  # ============================================================
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs: push-images

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Kubernetes image
        run: |
          sed -i \
            "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }}|" \
            k8s/deployment.yaml

      - name: Show deployment
        run: |
          cat k8s/deployment.yaml

      - name: Commit deployment change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          git commit \
            -m "Update Sudoku image to ${{ github.sha }}" \
            || echo "No changes"

          git push

  # ============================================================
  # 8. ARGO CD
  # ============================================================
  argocd:
    name: Deploy using Argo CD
    runs-on: ubuntu-latest

    needs: update-manifest

    steps:
      - name: Install Argo CD CLI
        run: |
          curl -sSL \
            -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd

      - name: Argo CD version
        run: |
          argocd version --client

      - name: Login to Argo CD
        run: |
          argocd login "${{ secrets.ARGOCD_SERVER }}" \
            --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" \
            --grpc-web \
            --insecure

      - name: Sync application
        run: |
          argocd app sync sudoko-game \
            --grpc-web

      - name: Wait for deployment
        run: |
          argocd app wait sudoko-game \
            --sync \
            --health \
            --timeout 300 \
            --grpc-web

      - name: Deployment successful
        run: |
          echo "======================================"
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          argocd app get sudoko-game --grpc-web
