name: Sudoku DevSecOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sudoku-game

jobs:

  # ==========================================
  # 1. CODE QUALITY + SECURITY
  # ==========================================

  security:
    name: SonarQube + Snyk
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------
      # SonarQube
      # --------------------------

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # --------------------------
      # Snyk
      # --------------------------

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Snyk Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --all-projects \
            --severity-threshold=high \
            || true


  # ==========================================
  # 2. DOCKER
  # ==========================================

  docker:
    name: Docker Build + Trivy
    runs-on: ubuntu-latest

    needs:
      - security

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------
      # Docker Login
      # --------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------
      # Build
      # --------------------------

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${GITHUB_SHA::7} \
            -t $IMAGE_NAME:latest \
            .

      # --------------------------
      # Install Trivy
      # --------------------------

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/trivy.gpg

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # --------------------------
      # Trivy
      # --------------------------

      - name: Trivy Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            $IMAGE_NAME:${GITHUB_SHA::7}

      # --------------------------
      # Push
      # --------------------------

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${GITHUB_SHA::7}
          docker push $IMAGE_NAME:latest


  # ==========================================
  # 3. UPDATE GITOPS MANIFEST
  # ==========================================

  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Image
        run: |
          sed -i \
          "s|image:.*|image: $IMAGE_NAME:${GITHUB_SHA::7}|" \
          k8s/deployment.yaml

      - name: Show Manifest
        run: |
          cat k8s/deployment.yaml

      - name: Commit Kubernetes Manifest
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          git diff --cached --quiet || \
            git commit \
            -m "chore: update sudoku image ${GITHUB_SHA::7}"

          git push


  # ==========================================
  # 4. ARGO CD
  # ==========================================

  argocd:
    name: Argo CD Deployment
    runs-on: ubuntu-latest

    needs:
      - update-manifest

    steps:

      - name: Install Argo CD CLI
        run: |

          curl -sSL \
            -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          sudo install \
            -m 555 \
            argocd \
            /usr/local/bin/argocd

      - name: Login Argo CD
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |

          argocd login \
            "${{ secrets.ARGOCD_SERVER }}" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

      - name: Sync Sudoku
        run: |

          argocd app sync sudoku

      - name: Wait for Healthy
        run: |

          argocd app wait sudoku \
            --sync \
            --health \
            --timeout 300

      - name: Application Status
        run: |

          argocd app get sudoku
