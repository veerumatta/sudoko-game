name: Sudoku DevSecOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: sudoko-game

jobs:

  # ============================================================
  # 1. BUILD / VALIDATE
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          set -e

          echo "Checking application files..."

          test -f index.html
          test -f script.js
          test -f style.css
          test -f Dockerfile

          echo "Application validation successful."


  # ============================================================
  # 2. SONARQUBE
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sudoko-game
            -Dsonar.projectName=sudoko-game
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8


  # ============================================================
  # 3. SNYK SECURITY SCAN
  # ============================================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Snyk
        run: |
          curl --compressed \
            https://static.snyk.io/cli/latest/snyk-linux \
            -o snyk

          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk

      - name: Check Snyk version
        run: |
          snyk --version

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"

      - name: Run Snyk scan
        run: |
          snyk test \
            --severity-threshold=high \
            || true


  # ============================================================
  # 4. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - snyk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:latest \
            .

      - name: Show Docker images
        run: |
          docker images


  # ============================================================
  # 5. TRIVY IMAGE SECURITY SCAN
  # ============================================================
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build image for Trivy
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }} \
            .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'


  # ============================================================
  # 6. PUSH IMAGE TO DOCKER HUB + NEXUS
  # ============================================================
  push-images:
    name: Push Image to Docker Hub and Nexus
    runs-on: ubuntu-latest

    needs: trivy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Nexus Login
      # --------------------------------------------------------
      - name: Login to Nexus Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # --------------------------------------------------------
      # Build image for both registries
      # --------------------------------------------------------
      - name: Build Docker images
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:latest \
            -t ${{ secrets.NEXUS_URL }}/sudoko-game:${{ github.sha }} \
            -t ${{ secrets.NEXUS_URL }}/sudoko-game:latest \
            .

      # --------------------------------------------------------
      # Push Docker Hub
      # --------------------------------------------------------
      - name: Push image to Docker Hub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:latest

      # --------------------------------------------------------
      # Push Nexus
      # --------------------------------------------------------
      - name: Push image to Nexus
        run: |
          docker push \
            ${{ secrets.NEXUS_URL }}/sudoko-game:${{ github.sha }}

          docker push \
            ${{ secrets.NEXUS_URL }}/sudoko-game:latest

      - name: Display image information
        run: |
          echo "======================================"
          echo "Docker Hub Image"
          echo "======================================"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }}"

          echo ""
          echo "======================================"
          echo "Nexus Image"
          echo "======================================"
          echo "${{ secrets.NEXUS_URL }}/sudoko-game:${{ github.sha }}"


  # ============================================================
  # 7. UPDATE KUBERNETES MANIFEST
  # ============================================================
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs: push-images

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Kubernetes image
        run: |
          set -e

          echo "Updating Kubernetes deployment..."

          sed -i \
            "s|^[[:space:]]*image:.*|        image: ${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game:${{ github.sha }}|" \
            k8s/deployment.yaml

      - name: Show updated deployment
        run: |
          echo "======================================"
          echo "Updated Kubernetes Deployment"
          echo "======================================"

          cat k8s/deployment.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Kubernetes change
        run: |
          git add k8s/deployment.yaml

          git diff --cached --quiet || \
            git commit \
            -m "Update Sudoku image to ${{ github.sha }} [skip ci]"

      - name: Push Kubernetes change
        run: |
          git push origin HEAD:main


  # ============================================================
  # 8. ARGO CD DEPLOYMENT
  # ============================================================
  argocd:
    name: Deploy using Argo CD
    runs-on: ubuntu-latest

    needs: update-manifest

    steps:

      # --------------------------------------------------------
      # Install Argo CD CLI
      # --------------------------------------------------------
      - name: Install Argo CD CLI
        run: |
          curl -sSL \
            -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x argocd

          sudo mv argocd /usr/local/bin/argocd

      # --------------------------------------------------------
      # Check Argo CD CLI
      # --------------------------------------------------------
      - name: Argo CD version
        run: |
          argocd version --client

      # --------------------------------------------------------
      # Login to Argo CD
      # --------------------------------------------------------
      - name: Login to Argo CD
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd login "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

      # --------------------------------------------------------
      # Check Argo CD application
      # --------------------------------------------------------
      - name: Check Argo CD application
        run: |
          argocd app get sudoko-game \
            --grpc-web

      # --------------------------------------------------------
      # Sync application
      # --------------------------------------------------------
      - name: Sync Argo CD application
        run: |
          argocd app sync sudoko-game \
            --grpc-web

      # --------------------------------------------------------
      # Wait for deployment
      # --------------------------------------------------------
      - name: Wait for application health
        run: |
          argocd app wait sudoko-game \
            --sync \
            --health \
            --timeout 300 \
            --grpc-web

      # --------------------------------------------------------
      # Final deployment information
      # --------------------------------------------------------
      - name: Deployment successful
        run: |
          echo "=============================================="
          echo "       SUDOKO DEPLOYMENT SUCCESSFUL"
          echo "=============================================="

          argocd app get sudoko-game \
            --grpc-web
