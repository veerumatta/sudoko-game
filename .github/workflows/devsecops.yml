name: Sudoku DevSecOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: sudoku-devsecops-main
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: sudoko-game
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game

jobs:

  # ============================================================
  # 1. BUILD / VALIDATE
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          set -e

          echo "=========================================="
          echo "Validating Sudoku project"
          echo "=========================================="

          test -f index.html
          test -f script.js
          test -f style.css
          test -f Dockerfile

          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          test -f k8s/namespace.yaml

          test -f argocd/application.yaml

          echo ""
          echo "Application validation successful."


  # ============================================================
  # 2. SONARQUBE
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sudoko-game
            -Dsonar.projectName=sudoko-game
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8


  # ============================================================
  # 3. SNYK SECURITY SCAN
  # ============================================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Snyk
        run: |
          set -e

          echo "Installing Snyk..."

          curl --compressed \
            https://static.snyk.io/cli/latest/snyk-linux \
            -o snyk

          chmod +x snyk

          sudo mv snyk /usr/local/bin/snyk

      - name: Check Snyk version
        run: |
          snyk --version

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -e

          test -n "$SNYK_TOKEN"

          snyk auth "$SNYK_TOKEN"

          echo "Snyk authentication successful."

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "Running Snyk security scan..."

          snyk test \
            --severity-threshold=high \
            || true

          echo "Snyk scan completed."


  # ============================================================
  # 4. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - snyk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -e

          echo "=========================================="
          echo "Building Docker image"
          echo "=========================================="

          docker build \
            -t "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.DOCKER_IMAGE }}:latest" \
            .

      - name: Show Docker images
        run: |
          docker images


  # ============================================================
  # 5. TRIVY IMAGE SECURITY SCAN
  # ============================================================
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build image for Trivy
        run: |
          set -e

          docker build \
            -t "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'


  # ============================================================
  # 6. PUSH IMAGE TO DOCKER HUB
  # ============================================================
  push-image:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest

    needs: trivy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          set -e

          docker build \
            -t "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.DOCKER_IMAGE }}:latest" \
            .

      - name: Push SHA image
        run: |
          set -e

          echo "Pushing SHA image..."

          docker push \
            "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

      - name: Push latest image
        run: |
          set -e

          echo "Pushing latest image..."

          docker push \
            "${{ env.DOCKER_IMAGE }}:latest"

      - name: Docker Hub push successful
        run: |
          echo "=========================================="
          echo "Docker Hub push successful"
          echo "=========================================="

          echo "SHA image:"
          echo "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

          echo ""
          echo "Latest image:"
          echo "${{ env.DOCKER_IMAGE }}:latest"


  # ============================================================
  # 7. UPDATE KUBERNETES MANIFEST
  # ============================================================
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs: push-image

    permissions:
      contents: write

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize with remote main
        run: |
          set -e

          echo "Fetching latest main branch..."

          git fetch origin main

          git checkout main

          git reset --hard origin/main

          echo "Repository synchronized."


      # --------------------------------------------------------
      # Update Docker image in Kubernetes
      # --------------------------------------------------------
      - name: Update Kubernetes image
        run: |
          set -e

          echo "=========================================="
          echo "Updating Kubernetes image"
          echo "=========================================="

          NEW_IMAGE="${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

          echo "New image:"
          echo "$NEW_IMAGE"

          sed -i \
            "s|^[[:space:]]*image:.*|        image: ${NEW_IMAGE}|" \
            k8s/deployment.yaml


      # --------------------------------------------------------
      # Display updated manifest
      # --------------------------------------------------------
      - name: Show updated deployment
        run: |
          echo "=========================================="
          echo "Updated Kubernetes Deployment"
          echo "=========================================="

          cat k8s/deployment.yaml


      # --------------------------------------------------------
      # Commit manifest
      # --------------------------------------------------------
      - name: Commit Kubernetes change
        run: |
          set -e

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes changes detected."
          else
            git commit \
              -m "Update Sudoku image to ${GITHUB_SHA} [skip ci]"

            echo "Kubernetes manifest committed."
          fi


      # --------------------------------------------------------
      # Push manifest
      # --------------------------------------------------------
      - name: Push Kubernetes change
        run: |
          set -e

          echo "Pushing Kubernetes manifest..."

          git push origin HEAD:main

          echo "Kubernetes manifest pushed successfully."


  # ============================================================
  # 8. ARGO CD GITOPS
  # ============================================================
  argocd:
    name: Argo CD GitOps Deployment
    runs-on: ubuntu-latest

    needs: update-manifest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Kubernetes manifest
        run: |
          set -e

          echo "=========================================="
          echo "Verifying Kubernetes manifest"
          echo "=========================================="

          test -f k8s/deployment.yaml

          grep -n "image:" k8s/deployment.yaml

          echo ""
          echo "Kubernetes manifest verified."


      - name: Verify Argo CD application manifest
        run: |
          set -e

          echo "=========================================="
          echo "Verifying Argo CD configuration"
          echo "=========================================="

          test -f argocd/application.yaml

          cat argocd/application.yaml

          echo ""
          echo "Argo CD application manifest verified."


      - name: GitOps deployment information
        run: |
          echo ""
          echo "=============================================="
          echo "       SUDOKO DEVSECOPS PIPELINE"
          echo "=============================================="
          echo ""
          echo "Application: sudoko-game"
          echo ""
          echo "Docker Image:"
          echo "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo ""
          echo "Docker Hub:"
          echo "Image pushed successfully."
          echo ""
          echo "Kubernetes:"
          echo "Manifest updated successfully."
          echo ""
          echo "Argo CD:"
          echo "Argo CD will detect the Git change and synchronize"
          echo "the application according to the Argo CD Application."
          echo ""
          echo "=============================================="
          echo "       GITOPS UPDATE SUCCESSFUL"
          echo "=============================================="
