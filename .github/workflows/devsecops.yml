name: Sudoku DevSecOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: sudoku-devsecops-main
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: sudoko-game
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game

jobs:

  # ============================================================
  # 1. BUILD / VALIDATE
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          set -e

          echo "Checking application files..."

          test -f index.html
          test -f script.js
          test -f style.css
          test -f Dockerfile

          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          test -f k8s/namespace.yaml

          test -f argocd/application.yaml

          echo "Application validation successful."


  # ============================================================
  # 2. SONARQUBE
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sudoko-game
            -Dsonar.projectName=sudoko-game
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8


  # ============================================================
  # 3. SNYK SECURITY SCAN
  # ============================================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Snyk
        run: |
          set -e

          curl --compressed \
            https://static.snyk.io/cli/latest/snyk-linux \
            -o snyk

          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk

      - name: Check Snyk version
        run: |
          snyk --version

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN"
          snyk auth "$SNYK_TOKEN"

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --severity-threshold=high \
            || true


  # ============================================================
  # 4. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - snyk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -e

          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            .

      - name: Show Docker image
        run: |
          docker images


  # ============================================================
  # 5. TRIVY SECURITY SCAN
  # ============================================================
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build image for Trivy
        run: |
          set -e

          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'


  # ============================================================
  # 6. PUSH TO DOCKER HUB
  # ============================================================
  push-image:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest

    needs: trivy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          set -e

          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            .

      - name: Push SHA image
        run: |
          docker push \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Docker push successful
        run: |
          echo "=========================================="
          echo "Docker Hub push successful"
          echo "=========================================="
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"


  # ============================================================
  # 7. UPDATE KUBERNETES MANIFEST
  # ============================================================
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs: push-image

    permissions:
      contents: write

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize with remote main
        run: |
          set -e

          git fetch origin main

          git checkout main

          git reset --hard origin/main

      - name: Update Kubernetes image
        run: |
          set -e

          echo "Updating Kubernetes deployment image..."

          sed -i \
            "s|^[[:space:]]*image:.*|        image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}|" \
            k8s/deployment.yaml

      - name: Show updated deployment
        run: |
          echo "=========================================="
          echo "Updated Kubernetes Deployment"
          echo "=========================================="

          cat k8s/deployment.yaml

      - name: Commit Kubernetes change
        run: |
          set -e

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes."
          else
            git commit \
              -m "Update Sudoku image to ${{ github.sha }} [skip ci]"
          fi

      - name: Push Kubernetes change
        run: |
          set -e

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main


  # ============================================================
  # 8. ARGO CD DEPLOYMENT
  # ============================================================
  argocd:
    name: Deploy using Argo CD
    runs-on: ubuntu-latest

    needs: update-manifest

    steps:

      # --------------------------------------------------------
      # Install Argo CD CLI
      # --------------------------------------------------------
      - name: Install Argo CD CLI
        run: |
          set -e

          curl -sSL \
            -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x argocd

          sudo mv argocd /usr/local/bin/argocd

      # --------------------------------------------------------
      # Check CLI
      # --------------------------------------------------------
      - name: Check Argo CD version
        run: |
          argocd version --client

      # --------------------------------------------------------
      # Test Argo CD endpoint
      # --------------------------------------------------------
      - name: Test Argo CD connection
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
        run: |
          set -e

          echo "Testing Argo CD endpoint..."

          curl -k \
            --connect-timeout 10 \
            --max-time 20 \
            "https://${ARGOCD_SERVER}/"

          echo ""
          echo "Argo CD endpoint is reachable."


      # --------------------------------------------------------
      # Login to Argo CD
      # --------------------------------------------------------
      - name: Login to Argo CD
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -e

          test -n "$ARGOCD_SERVER"
          test -n "$ARGOCD_AUTH_TOKEN"

          echo "Logging into Argo CD..."

          argocd login "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

          echo "Argo CD login successful."


      # --------------------------------------------------------
      # Check application
      # --------------------------------------------------------
      - name: Check Argo CD application
        run: |
          set -e

          argocd app get sudoko-game \
            --grpc-web


      # --------------------------------------------------------
      # Sync application
      # --------------------------------------------------------
      - name: Sync Argo CD application
        run: |
          set -e

          argocd app sync sudoko-game \
            --grpc-web


      # --------------------------------------------------------
      # Wait for application
      # --------------------------------------------------------
      - name: Wait for application health
        run: |
          set -e

          argocd app wait sudoko-game \
            --sync \
            --health \
            --timeout 300 \
            --grpc-web


      # --------------------------------------------------------
      # Success
      # --------------------------------------------------------
      - name: Deployment successful
        run: |
          echo "=============================================="
          echo "       SUDOKO DEPLOYMENT SUCCESSFUL"
          echo "=============================================="

          argocd app get sudoko-game \
            --grpc-web
