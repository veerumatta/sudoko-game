name: Sudoku DevSecOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: sudoku-devsecops-main
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: sudoko-game
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sudoko-game

jobs:

  # ============================================================
  # 1. BUILD / VALIDATE
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          set -e

          echo "=========================================="
          echo "Validating Sudoku project"
          echo "=========================================="

          test -f index.html
          test -f script.js
          test -f style.css
          test -f Dockerfile

          test -f k8s/namespace.yaml
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml

          test -f argocd/application.yaml

          echo ""
          echo "All required files exist."
          echo "Application validation successful."


  # ============================================================
  # 2. SONARQUBE
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sudoko-game
            -Dsonar.projectName=sudoko-game
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8


  # ============================================================
  # 3. SNYK SECURITY SCAN
  # ============================================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Snyk
        run: |
          set -e

          echo "=========================================="
          echo "Installing Snyk"
          echo "=========================================="

          curl --compressed \
            https://static.snyk.io/cli/latest/snyk-linux \
            -o snyk

          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk

          snyk --version

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -e

          test -n "$SNYK_TOKEN"

          snyk auth "$SNYK_TOKEN"

          echo "Snyk authentication successful."

      - name: Run Snyk scan
        run: |
          set -e

          echo "=========================================="
          echo "Running Snyk security scan"
          echo "=========================================="

          snyk test \
            --severity-threshold=high \
            || true

          echo ""
          echo "Snyk scan completed."


  # ============================================================
  # 4. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - snyk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -e

          echo "=========================================="
          echo "Building Docker image"
          echo "=========================================="

          docker build \
            -t "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.DOCKER_IMAGE }}:latest" \
            .

          echo ""
          echo "Docker build successful."

      - name: Show Docker images
        run: |
          docker images "${{ env.DOCKER_IMAGE }}"


  # ============================================================
  # 5. TRIVY IMAGE SECURITY SCAN
  # ============================================================
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build image for Trivy
        run: |
          set -e

          echo "=========================================="
          echo "Building image for Trivy"
          echo "=========================================="

          docker build \
            -t "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'


  # ============================================================
  # 6. PUSH IMAGE TO DOCKER HUB
  # ============================================================
  push-image:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest

    needs: trivy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          set -e

          echo "=========================================="
          echo "Building Docker image"
          echo "=========================================="

          docker build \
            -t "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.DOCKER_IMAGE }}:latest" \
            .

      - name: Push SHA image
        run: |
          set -e

          echo "=========================================="
          echo "Pushing SHA image"
          echo "=========================================="

          docker push \
            "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

      - name: Push latest image
        run: |
          set -e

          echo "=========================================="
          echo "Pushing latest image"
          echo "=========================================="

          docker push \
            "${{ env.DOCKER_IMAGE }}:latest"

      - name: Docker Hub push successful
        run: |
          echo "=========================================="
          echo "Docker Hub push successful"
          echo "=========================================="

          echo "SHA image:"
          echo "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

          echo ""
          echo "Latest image:"
          echo "${{ env.DOCKER_IMAGE }}:latest"


  # ============================================================
  # 7. UPDATE KUBERNETES MANIFEST
  # ============================================================
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs: push-image

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ----------------------------------------------------------
      # Configure Git
      # ----------------------------------------------------------
      - name: Configure Git
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ----------------------------------------------------------
      # Synchronize repository
      # ----------------------------------------------------------
      - name: Synchronize with remote main
        run: |
          set -e

          echo "=========================================="
          echo "Synchronizing repository"
          echo "=========================================="

          git fetch origin main

          git checkout main

          git reset --hard origin/main

          echo "Repository synchronized."

      # ----------------------------------------------------------
      # Update Docker image
      # ----------------------------------------------------------
      - name: Update Kubernetes image
        run: |
          set -e

          echo "=========================================="
          echo "Updating Kubernetes image"
          echo "=========================================="

          NEW_IMAGE="${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

          echo "New image:"
          echo "$NEW_IMAGE"

          sed -i \
            "s|^[[:space:]]*image:.*|          image: ${NEW_IMAGE}|" \
            k8s/deployment.yaml

          echo ""
          echo "Image updated."

      # ----------------------------------------------------------
      # Verify image
      # ----------------------------------------------------------
      - name: Verify deployment image
        run: |
          set -e

          echo "=========================================="
          echo "Checking deployment image"
          echo "=========================================="

          grep -n "image:" k8s/deployment.yaml

          echo ""
          echo "Expected image:"
          echo "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

      # ----------------------------------------------------------
      # Validate files WITHOUT kubectl
      # ----------------------------------------------------------
      - name: Validate Kubernetes manifest files
        run: |
          set -e

          echo "=========================================="
          echo "Validating Kubernetes manifest files"
          echo "=========================================="

          test -f k8s/namespace.yaml
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml

          echo ""
          echo "Required Kubernetes files exist."

          echo ""
          echo "Namespace:"
          cat k8s/namespace.yaml

          echo ""
          echo "Deployment:"
          cat k8s/deployment.yaml

          echo ""
          echo "Service:"
          cat k8s/service.yaml

          echo ""
          echo "Manifest file validation successful."

      # ----------------------------------------------------------
      # Commit
      # ----------------------------------------------------------
      - name: Commit Kubernetes change
        run: |
          set -e

          echo "=========================================="
          echo "Committing Kubernetes change"
          echo "=========================================="

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes changes detected."
          else
            git commit \
              -m "Update Sudoku image to ${GITHUB_SHA} [skip ci]"

            echo "Kubernetes manifest committed."
          fi

      # ----------------------------------------------------------
      # Push
      # ----------------------------------------------------------
      - name: Push Kubernetes change
        run: |
          set -e

          echo "=========================================="
          echo "Pushing Kubernetes manifest"
          echo "=========================================="

          git push origin HEAD:main

          echo ""
          echo "Kubernetes manifest pushed successfully."


  # ============================================================
  # 8. ARGO CD GITOPS DEPLOYMENT
  # ============================================================
  argocd:
    name: Argo CD GitOps Deployment

    # IMPORTANT:
    # This MUST be your EC2 self-hosted runner.
    #
    # It needs:
    #   kubectl
    #   access to Minikube
    #   ~/.kube/config
    #
    runs-on: self-hosted

    needs: update-manifest

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ----------------------------------------------------------
      # Get latest main
      # ----------------------------------------------------------
      - name: Synchronize repository
        run: |
          set -e

          echo "=========================================="
          echo "Synchronizing repository"
          echo "=========================================="

          git fetch origin main

          git checkout main

          git reset --hard origin/main

          echo ""
          echo "Latest commit:"
          git log -1 --oneline

          echo ""
          echo "Repository synchronized."

      # ----------------------------------------------------------
      # Verify kubectl
      # ----------------------------------------------------------
      - name: Verify kubectl
        run: |
          set -e

          echo "=========================================="
          echo "Checking kubectl"
          echo "=========================================="

          kubectl version --client

          echo ""
          echo "kubectl available."

      # ----------------------------------------------------------
      # Verify Kubernetes access
      # ----------------------------------------------------------
      - name: Verify Kubernetes access
        run: |
          set -e

          echo "=========================================="
          echo "Checking Kubernetes access"
          echo "=========================================="

          echo "Current Kubernetes context:"
          kubectl config current-context

          echo ""
          echo "Kubernetes nodes:"
          kubectl get nodes

          echo ""
          echo "Kubernetes access successful."

      # ----------------------------------------------------------
      # Verify Argo CD
      # ----------------------------------------------------------
      - name: Verify Argo CD
        run: |
          set -e

          echo "=========================================="
          echo "Checking Argo CD"
          echo "=========================================="

          kubectl get namespace argocd

          echo ""
          echo "Argo CD pods:"
          kubectl get pods -n argocd

          echo ""
          echo "Argo CD is available."

      # ----------------------------------------------------------
      # Verify Kubernetes files
      # ----------------------------------------------------------
      - name: Verify Kubernetes manifests
        run: |
          set -e

          echo "=========================================="
          echo "Verifying Kubernetes manifests"
          echo "=========================================="

          test -f k8s/namespace.yaml
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml

          echo ""
          echo "Deployment image:"
          grep -n "image:" k8s/deployment.yaml

          echo ""
          echo "Kubernetes manifest files verified."

      # ----------------------------------------------------------
      # Verify Argo CD Application
      # ----------------------------------------------------------
      - name: Verify Argo CD Application manifest
        run: |
          set -e

          echo "=========================================="
          echo "Verifying Argo CD Application"
          echo "=========================================="

          test -f argocd/application.yaml

          echo ""
          cat argocd/application.yaml

          echo ""
          echo "Argo CD Application manifest exists."

      # ----------------------------------------------------------
      # Apply Argo CD Application
      # ----------------------------------------------------------
      - name: Apply Argo CD Application
        run: |
          set -e

          echo "=========================================="
          echo "Creating / Updating Argo CD Application"
          echo "=========================================="

          kubectl apply \
            -f argocd/application.yaml

          echo ""
          echo "Argo CD Application applied successfully."

      # ----------------------------------------------------------
      # Show Application
      # ----------------------------------------------------------
      - name: Check Argo CD Application
        run: |
          set -e

          echo "=========================================="
          echo "Argo CD Application"
          echo "=========================================="

          kubectl get application sudoku -n argocd -o wide

      # ----------------------------------------------------------
      # Wait for Argo CD Sync and Health
      # ----------------------------------------------------------
      - name: Wait for Argo CD Sync and Health
        run: |
          set -e

          echo "=========================================="
          echo "Waiting for Argo CD synchronization"
          echo "=========================================="

          for i in {1..60}; do

            SYNC_STATUS=$(kubectl get application sudoku \
              -n argocd \
              -o jsonpath='{.status.sync.status}' \
              2>/dev/null || true)

            HEALTH_STATUS=$(kubectl get application sudoku \
              -n argocd \
              -o jsonpath='{.status.health.status}' \
              2>/dev/null || true)

            echo "Attempt $i/60"
            echo "Sync Status: ${SYNC_STATUS:-Unknown}"
            echo "Health Status: ${HEALTH_STATUS:-Unknown}"
            echo ""

            if [ "$SYNC_STATUS" = "Synced" ] && \
               [ "$HEALTH_STATUS" = "Healthy" ]; then

              echo "=========================================="
              echo "Argo CD deployment successful!"
              echo "=========================================="

              exit 0
            fi

            sleep 5
          done

          # ------------------------------------------------------
          # Timeout diagnostics
          # ------------------------------------------------------

          echo "=========================================="
          echo "Argo CD deployment timeout"
          echo "=========================================="

          echo ""
          echo "Application:"
          kubectl get application sudoku \
            -n argocd \
            -o yaml

          echo ""
          echo "Argo CD application resources:"
          kubectl get application sudoku \
            -n argocd

          echo ""
          echo "Kubernetes resources:"
          kubectl get all \
            -n sudoku \
            || true

          echo ""
          echo "Pods:"
          kubectl get pods \
            -n sudoku \
            -o wide \
            || true

          echo ""
          echo "Events:"
          kubectl get events \
            -n sudoku \
            --sort-by=.lastTimestamp \
            || true

          exit 1

      # ----------------------------------------------------------
      # Final deployment status
      # ----------------------------------------------------------
      - name: Final deployment status
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "       SUDOKO DEVSECOPS PIPELINE"
          echo "=============================================="
          echo ""

          echo "Application: sudoku"

          echo ""
          echo "Docker Image:"
          echo "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

          echo ""
          echo "Argo CD:"
          kubectl get application sudoku -n argocd

          echo ""
          echo "Kubernetes resources:"
          kubectl get all -n sudoku

          echo ""
          echo "Pods:"
          kubectl get pods -n sudoku -o wide

          echo ""
          echo "Services:"
          kubectl get svc -n sudoku

          echo ""
          echo "=============================================="
          echo "       GITOPS DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
