name: Sudoku DevSecOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent multiple workflows from changing main simultaneously
concurrency:
  group: sudoku-devsecops-main
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: sudoko-game
  DOCKERHUB_USERNAME: veerumatta
  DOCKER_IMAGE: veerumatta/sudoko-game

jobs:

  # ============================================================
  # 1. BUILD / VALIDATE
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          set -e

          echo "======================================"
          echo "Checking application files"
          echo "======================================"

          test -f index.html
          test -f script.js
          test -f style.css
          test -f Dockerfile

          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          test -f k8s/namespace.yaml

          test -f argocd/application.yaml

          echo "All required files found."
          echo "Application validation successful."


  # ============================================================
  # 2. SONARQUBE
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sudoko-game
            -Dsonar.projectName=sudoko-game
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8


  # ============================================================
  # 3. SNYK SECURITY SCAN
  # ============================================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Snyk
        run: |
          set -e

          curl --compressed \
            https://static.snyk.io/cli/latest/snyk-linux \
            -o snyk

          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk

      - name: Check Snyk version
        run: |
          snyk --version

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "ERROR: SNYK_TOKEN is not configured."
            exit 1
          fi

          snyk auth "$SNYK_TOKEN"

      - name: Run Snyk scan
        run: |
          snyk test \
            --severity-threshold=high \
            || true


  # ============================================================
  # 4. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - snyk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -e

          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            .

      - name: Show Docker images
        run: |
          docker images


  # ============================================================
  # 5. TRIVY IMAGE SECURITY SCAN
  # ============================================================
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # GitHub Actions jobs use separate runners,
      # therefore the image must be rebuilt here.
      - name: Build Docker image for Trivy
        run: |
          set -e

          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'


  # ============================================================
  # 6. LOGIN + PUSH TO DOCKER HUB
  # ============================================================
  push-image:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest

    needs: trivy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Verify Docker Hub configuration
      # --------------------------------------------------------
      - name: Verify Docker Hub configuration
        run: |
          echo "Docker Hub username: ${{ env.DOCKERHUB_USERNAME }}"
          echo "Docker image: ${{ env.DOCKER_IMAGE }}"

      # --------------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Build image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          set -e

          docker build \
            -t docker.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            -t docker.io/${{ env.DOCKER_IMAGE }}:latest \
            .

      # --------------------------------------------------------
      # Show image
      # --------------------------------------------------------
      - name: Show Docker image
        run: |
          docker images | grep sudoko-game || true

      # --------------------------------------------------------
      # Push SHA image
      # --------------------------------------------------------
      - name: Push SHA image to Docker Hub
        run: |
          set -e

          docker push \
            docker.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # --------------------------------------------------------
      # Push latest image
      # --------------------------------------------------------
      - name: Push latest image to Docker Hub
        run: |
          set -e

          docker push \
            docker.io/${{ env.DOCKER_IMAGE }}:latest

      # --------------------------------------------------------
      # Final Docker Hub information
      # --------------------------------------------------------
      - name: Display Docker Hub image
        run: |
          echo "=============================================="
          echo "Docker Hub Push Successful"
          echo "=============================================="

          echo "SHA:"
          echo "docker.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

          echo ""
          echo "Latest:"
          echo "docker.io/${{ env.DOCKER_IMAGE }}:latest"


  # ============================================================
  # 7. UPDATE KUBERNETES MANIFEST
  # ============================================================
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs: push-image

    permissions:
      contents: write

    steps:

      # --------------------------------------------------------
      # Checkout latest main
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # --------------------------------------------------------
      # Configure Git
      # --------------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "veerumatta"
          git config user.email "veeruveerareddy9@gmail.com"

      # --------------------------------------------------------
      # Get latest remote main
      # --------------------------------------------------------
      - name: Synchronize with latest main
        run: |
          set -e

          git fetch origin main

          git checkout main

          git reset --hard origin/main

          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git log -1 --oneline

      # --------------------------------------------------------
      # Update Kubernetes image
      # --------------------------------------------------------
      - name: Update Kubernetes image
        run: |
          set -e

          echo "======================================"
          echo "Updating Kubernetes image"
          echo "======================================"

          sed -i \
            "s|^[[:space:]]*image:.*|        image: docker.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }}|" \
            k8s/deployment.yaml

      # --------------------------------------------------------
      # Show deployment
      # --------------------------------------------------------
      - name: Show updated deployment
        run: |
          echo "======================================"
          echo "Updated deployment.yaml"
          echo "======================================"

          cat k8s/deployment.yaml

      # --------------------------------------------------------
      # Commit manifest
      # --------------------------------------------------------
      - name: Commit Kubernetes change
        run: |
          set -e

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes."
          else
            git commit \
              -m "Update Sudoku image to ${{ github.sha }} [skip ci]"
          fi

      # --------------------------------------------------------
      # Push manifest
      # --------------------------------------------------------
      - name: Push Kubernetes change
        run: |
          set -e

          for attempt in 1 2 3; do

            echo "======================================"
            echo "Push attempt: $attempt"
            echo "======================================"

            if git push origin main; then
              echo "Kubernetes manifest pushed successfully."
              exit 0
            fi

            echo "Push rejected."
            echo "Fetching latest main..."

            git fetch origin main

            git rebase origin/main

          done

          echo "Failed to push Kubernetes manifest."
          exit 1


  # ============================================================
  # 8. ARGO CD DEPLOYMENT
  # ============================================================
  argocd:
    name: Deploy using Argo CD
    runs-on: ubuntu-latest

    needs: update-manifest

    steps:

      # --------------------------------------------------------
      # Install Argo CD CLI
      # --------------------------------------------------------
      - name: Install Argo CD CLI
        run: |
          set -e

          curl -sSL \
            -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x argocd

          sudo mv argocd /usr/local/bin/argocd

      # --------------------------------------------------------
      # Check Argo CD version
      # --------------------------------------------------------
      - name: Argo CD version
        run: |
          argocd version --client

      # --------------------------------------------------------
      # Validate Argo CD server
      # --------------------------------------------------------
      - name: Validate Argo CD server
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
        run: |
          set -e

          if [ -z "$ARGOCD_SERVER" ]; then
            echo "ERROR: ARGOCD_SERVER secret is empty."
            exit 1
          fi

          if [[ "$ARGOCD_SERVER" == *"localhost"* ]]; then
            echo "ERROR: ARGOCD_SERVER cannot contain localhost."
            exit 1
          fi

          if [[ "$ARGOCD_SERVER" == *"//"* ]]; then
            echo "ERROR: ARGOCD_SERVER must be HOST:PORT."
            echo "Example:"
            echo "18.145.229.8:31102"
            exit 1
          fi

          echo "Argo CD server:"
          echo "$ARGOCD_SERVER"

      # --------------------------------------------------------
      # Login to Argo CD
      # --------------------------------------------------------
      - name: Login to Argo CD
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -e

          argocd login "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

      # --------------------------------------------------------
      # Check application
      # --------------------------------------------------------
      - name: Check Argo CD application
        run: |
          set -e

          argocd app get sudoko-game \
            --grpc-web

      # --------------------------------------------------------
      # Sync application
      # --------------------------------------------------------
      - name: Sync Argo CD application
        run: |
          set -e

          argocd app sync sudoko-game \
            --grpc-web

      # --------------------------------------------------------
      # Wait for application
      # --------------------------------------------------------
      - name: Wait for application health
        run: |
          set -e

          argocd app wait sudoko-game \
            --sync \
            --health \
            --timeout 300 \
            --grpc-web

      # --------------------------------------------------------
      # Deployment successful
      # --------------------------------------------------------
      - name: Deployment successful
        run: |
          echo "=============================================="
          echo "       SUDOKO DEPLOYMENT SUCCESSFUL"
          echo "=============================================="

          echo ""
          echo "Docker Image:"
          echo "docker.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

          echo ""
          echo "Argo CD Application:"
          echo "sudoko-game"

          echo ""
          echo "Deployment completed successfully."

          argocd app get sudoko-game \
            --grpc-web
